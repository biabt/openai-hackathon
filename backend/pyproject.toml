[project]
name = "city-os"
version = "0.1.0"
description = "Deterministic City OS ambulance simulation and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "geopandas>=1.0,<2.0",
    "h3>=4.1,<5.0",
    "networkx>=3.4,<4.0",
    "numpy>=2.1,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "osmnx>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=18.0,<20.0",
    "pydantic>=2.10,<3.0",
    "shapely>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "ultralytics>=8.3,<9.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120,<7.0",
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
